[package]
name = "routa-procsvc"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "routa-procsvc"
path = "src/main.rs"

[dependencies]
routa-procsvc-proto = { path = "../procsvc-proto" }
libloading = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Rpc",
    "Win32_System_Threading",
] }
