[workspace]
members = ["procsvc-proto", "procsvc"]

[package]
name = "routa"
version = "0.8.3"
edition = "2021"

[lib]
name = "routa_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
uuid = { version = "1", features = ["v4"] }
specta-typescript = "=0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
url = "2.5.8"
percent-encoding = "2.3.2"
base64 = "0.23.1"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["process", "io-util", "time", "net", "macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "native-tls"] }
tokio-tungstenite = "0.26"
routa-procsvc-proto = { path = "procsvc-proto", features = ["specta"] }
anyhow = "1"
getrandom = "0.3"
minisign-verify = "0.2"
semver = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
minisign = "0.7"

[target."cfg(windows)".dependencies]
ipconfig = "0.3.4"
tauri-winrt-notification = "0.7"
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Networking", "Networking_Connectivity"] }
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
