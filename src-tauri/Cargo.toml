[package]
name = "mihomo-mapper"
version = "0.1.0"
edition = "2021"

[lib]
name = "mihomo_mapper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["serde_json"] }
uuid = { version = "1", features = ["v4"] }
specta-typescript = "=0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
url = "2.5.8"
percent-encoding = "2.3.2"
base64 = "0.23.1"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["process", "io-util", "time", "net", "macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "native-tls"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[target."cfg(windows)".dependencies]
ipconfig = "0.3.4"
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }
