<text x="598" y="975" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >直接操作：切换节点、编辑配置、测速、复制。</text>
<text x="598" y="1004" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >“⋯”展开：删除代理；仅操作时出现菜单。</text>
<text x="598" y="1033" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >名称过长时省略，悬停或键盘聚焦查看完整名称。</text>
<text x="1144" y="943" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" >同一套响应逻辑</text>
<text x="1144" y="975" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >宽屏保持宽度上限；窄屏在箭头处换行。</text>
<text x="1144" y="1004" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >代理数量变化时保持视图选择，避免突然重排。</text>
<text x="1144" y="1033" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >主区内部滚动，标题、筛选和底部计数固定。</text>
