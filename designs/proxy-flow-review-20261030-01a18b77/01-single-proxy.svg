<circle cx="1352" cy="145" r="12" fill="#0067c0"/>
<text x="1352" y="149" font-size="11" fill="white" font-weight="600" text-anchor="middle" >1</text>
<text x="1375" y="150" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >名称与状态先行</text>
<text x="1340" y="191" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >“机场”与“运行中”并列。</text>
<text x="1340" y="216" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >启停与更多菜单位于右上角，</text>
<text x="1340" y="241" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >不打断主要信息的阅读顺序。</text>
<circle cx="1352" cy="347" r="12" fill="#0067c0"/>
<text x="1352" y="351" font-size="11" fill="white" font-weight="600" text-anchor="middle" >2</text>
<text x="1375" y="352" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >入口 → 当前节点</text>
<text x="1340" y="393" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >协议和端口指向实际节点，</text>
<text x="1340" y="418" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >形成一条连续的流量路径。</text>
<text x="1340" y="443" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >“切换节点”紧邻去向，</text>
<text x="1340" y="468" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >常用操作一步可达。</text>
<circle cx="1352" cy="578" r="12" fill="#0067c0"/>
<text x="1352" y="582" font-size="11" fill="white" font-weight="600" text-anchor="middle" >3</text>
<text x="1375" y="583" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >策略、性能逐级后退</text>
<text x="1340" y="624" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >策略与网卡合并为一行。</text>
<text x="1340" y="649" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >延迟、速率、累计量集中到底栏；</text>
<text x="1340" y="674" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >配置入口统一为“编辑配置”。</text>
<path d="M1340 768H1648" stroke="#dce1e8" stroke-width="1" />
<text x="1340" y="798" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >872 × 270 px 的信息卡片</text>
<text x="1340" y="823" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >宽度有上限，按信息关系横向展开；</text>
