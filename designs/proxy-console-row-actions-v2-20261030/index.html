<script>
const rows=[{"name": "机场", "port": "7893", "proto": "SOCKS5", "node": "新加坡01", "mode": "手动选择", "nic": "系统默认网卡", "delay": "182 ms", "up": "24 KB/s", "down": "2.8 MB/s", "state": "运行中", "kind": "green", "on": true}, {"name": "开发工具", "port": "7894", "proto": "Mixed", "node": "新加坡01", "mode": "手动选择", "nic": "以太网", "delay": "182 ms", "up": "8 KB/s", "down": "420 KB/s", "state": "运行中", "kind": "green", "on": true}, {"name": "下载专用", "port": "7895", "proto": "HTTP", "node": "美国西部02", "mode": "自动测速", "nic": "系统默认网卡", "delay": "356 ms", "up": "126 KB/s", "down": "8.2 MB/s", "state": "运行中", "kind": "green", "on": true}, {"name": "浏览器", "port": "7896", "proto": "Mixed", "node": "东京01", "mode": "手动选择", "nic": "系统默认网卡", "delay": "58 ms", "up": "12 KB/s", "down": "1.4 MB/s", "state": "运行中", "kind": "green", "on": true}, {"name": "内网直连", "port": "7897", "proto": "SOCKS5", "node": "直连", "mode": "直连", "nic": "Wi-Fi", "delay": "—", "up": "—", "down": "—", "state": "已关闭", "kind": "gray", "on": false}, {"name": "备用线路", "port": "7898", "proto": "Mixed", "node": "香港02", "mode": "手动选择", "nic": "系统默认网卡", "delay": "—", "up": "—", "down": "—", "state": "启动失败", "kind": "red", "on": true}];
rows.forEach(r=>{r.sourceKind=r.kind;r.baseDelay=r.delay});
const $=s=>document.querySelector(s),stage=$('#stage'),picker=$('#picker');
let target=-1,menuTarget=-1,chosen='',busy=false,returnFocus=null,toastTimer=null,anchor=null;

function drawNodes(){const list=$('#nodes'),q=$('#searchNode').value.trim().toLowerCase(),names=candidates().filter(n=>n.toLowerCase().includes(q));list.replaceChildren();for(const name of names){const b=document.createElement('button');b.className='node';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(name===chosen));b.disabled=busy;const text=document.createElement('span'),delay=document.createElement('small');text.textContent=name;delay.textContent=name==='东京02'?'58 ms':name==='香港03'?'76 ms':rows[target].baseDelay;b.append(text,delay);b.onclick=()=>{chosen=name;feedback('','');$('#confirmNode').textContent='确认切换';drawNodes()};list.append(b)}if(!names.length){const e=document.createElement('p');e.className='empty';e.textContent='未找到匹配节点';list.append(e)}$('#nodeCount').textContent=names.length+' / '+candidates().length+' 个节点';$('#confirmNode').disabled=busy||(chosen===rows[target].node&&rows[target].sourceKind!=='red');$('#searchNode').disabled=busy;$('#closePicker').disabled=busy;}
function place(){if(!anchor)return;const r=anchor.getBoundingClientRect(),w=Math.min(366,innerWidth-40),h=Math.min(364,innerHeight-40);picker.style.left=Math.max(20,Math.min(innerWidth-w-20,r.right-w+16))+'px';picker.style.top=Math.max(20,Math.min(innerHeight-h-20,r.bottom+h+8>innerHeight-20?r.top-h-8:r.bottom+8))+'px'}
function openPicker(i,element){target=i;anchor=element;returnFocus=element;busy=false;chosen=rows[i].node;$('#pickerTitle').textContent='切换节点 · '+rows[i].name;$('#currentNode').textContent=rows[i].sourceKind==='red'?'当前未生效 · 配置：'+rows[i].node:!rows[i].on?'代理已关闭 · 配置：'+rows[i].node:'当前生效：'+rows[i].node;$('#searchNode').value='';$('#confirmNode').textContent='确认切换';feedback('','');drawNodes();place();picker.showModal()}
function closePicker(){if(busy)return;picker.close();returnFocus?.focus()}
function submit(){if(busy||$('#confirmNode').disabled)return;busy=true;const i=target,outcome=$('#outcome').value,node=chosen;$('#confirmNode').textContent='切换中…';feedback('pending','正在切换到'+node+'…');drawNodes();setTimeout(()=>{busy=false;const r=rows[i];if(outcome==='success'&&r.on&&r.sourceKind!=='red'){r.node=node;r.delay=node==='东京02'?'58 ms':node==='香港03'?'76 ms':r.baseDelay;update(i);picker.close();returnFocus?.focus();notify(r.name+' 已切换到'+node)}else{feedback('error',r.sourceKind==='red'?'选择尚未生效，端口仍被占用。':!r.on?'选择尚未生效，代理当前已关闭。':outcome==='unapplied'?'选择已保存，尚未生效。请重试。':'未能保存节点选择，请重试。');$('#confirmNode').textContent='重试';drawNodes()}},1100)}
function context(i,label){returnFocus=document.activeElement;$('#contextTitle').textContent=label+' · '+rows[i].name;$('#contextContent').textContent=rows[i].name+' · '+rows[i].proto+' :'+rows[i].port+' → '+rows[i].node;$('#contextDialog').showModal()}
function test(i){const r=rows[i],el=rowEl(i).querySelector('[data-delay]');el.textContent=r.on&&r.sourceKind!=='red'?'测速中…':'—';setTimeout(()=>{update(i);notify('测速演示完成 · '+r.name)},800)}
stage.addEventListener('click',event=>{const sw=event.target.closest('[data-switch]');if(sw){openPicker(Number(sw.dataset.switch),sw);return}const edit=event.target.closest('[data-edit]');if(edit){context(Number(edit.dataset.edit),'编辑配置');return}const toggle=event.target.closest('[data-toggle]');if(toggle){if(toggle.getAttribute('aria-disabled')==='true')return;const i=Number(toggle.dataset.toggle);rows[i].on=!rows[i].on;update(i,true);setTimeout(()=>update(i),600);return}const more=event.target.closest('[data-more-row]');if(more){menuTarget=Number(more.dataset.moreRow);const box=$('#menu'),r=more.getBoundingClientRect(),s=stage.getBoundingClientRect();box.hidden=!box.hidden;box.style.left=Math.max(8,Math.min(s.width-168,r.right-s.left-160))+'px';box.style.top=Math.max(8,Math.min(s.height-136,r.bottom-s.top+4))+'px';$('#testRow').focus();return}if(event.target.closest('[data-action="test-all"]'))rows.forEach((r,i)=>test(i))});
stage.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-switch],[data-edit],[data-toggle],[data-more-row],[data-action="test-all"]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(event.key==='Escape')$('#menu').hidden=true});
$('#searchNode').oninput=drawNodes;$('#confirmNode').onclick=submit;$('#closePicker').onclick=closePicker;picker.addEventListener('cancel',event=>{if(busy)event.preventDefault()});picker.addEventListener('click',event=>{if(event.target===picker){const r=picker.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closePicker()}});window.addEventListener('resize',()=>{if(picker.open)place()});
$('#testRow').onclick=()=>{$('#menu').hidden=true;test(menuTarget)};$('#copyRow').onclick=()=>{$('#menu').hidden=true;notify('复制地址演示 · 127.0.0.1:'+rows[menuTarget].port)};$('#deleteRow').onclick=()=>{$('#menu').hidden=true;context(menuTarget,'删除代理入口')};$('#closeContext').onclick=()=>{$('#contextDialog').close();returnFocus?.focus()};document.addEventListener('pointerdown',event=>{if(!event.target.closest('#menu,[data-more-row]'))$('#menu').hidden=true});
</script></body></html>
