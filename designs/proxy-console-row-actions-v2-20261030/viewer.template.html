<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routa · 操作归属对应行</title><style>
:root{font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;background:#e9edf2;color:#1b1b1b;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1360px;margin:auto;padding:24px 32px}h1{margin:0 0 8px;font-size:23px;font-weight:600}p{font-size:12px;color:#616161;line-height:1.8;margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #0067c0;outline-offset:3px}.tools{display:flex;align-items:center;gap:10px;margin:16px 0;color:#616161;font-size:12px}.tools select{font-size:12px;background:white;border:1px solid #ccd2d9;border-radius:4px;padding:6px 10px}#stage{position:relative}#stage>svg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 8px 30px #23364c12}#stage [data-row]:hover>[data-row-bg]{fill:#fafcfe}#stage [data-action-hit]{transition:fill .1s}#stage [data-edit]:hover>[data-action-hit],#stage [data-switch]:hover>[data-action-hit],#stage [data-more-row]:hover>[data-action-hit]{fill:#e7f1fc}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:16px;color:#616161;font-size:12px}a{color:#0067c0;text-decoration:none}dialog{border:1px solid #c7cfd9;border-radius:7px;padding:0;background:white;box-shadow:0 10px 40px #172a4530;color:#1b1b1b;overflow:hidden}dialog::backdrop{background:transparent}#picker{position:fixed;margin:0;width:366px;height:364px;max-width:calc(100vw - 40px);max-height:calc(100dvh - 40px)}#picker[open]{display:flex;flex-direction:column}.picker-head{height:64px;flex-shrink:0;padding:16px 20px 0;position:relative}.picker-head h2{font-size:17px;font-weight:600;margin:0 28px 6px 0}.picker-head p{font-size:11px}.close-icon{position:absolute;right:12px;top:12px;width:28px;height:28px;background:transparent;border:0;border-radius:4px;color:#616161;font-size:20px}.close-icon:hover{background:#f3f3f3}.picker-tools{height:44px;flex-shrink:0;padding:6px 20px}.picker-tools input{width:100%;height:30px;border:1px solid #d6d6d6;border-radius:4px;padding:5px 10px;font-size:12px}.nodes{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:5px 20px;display:flex;flex-direction:column;gap:8px}.node{flex-shrink:0;width:100%;height:40px;border:1px solid #e1e4e8;border-radius:4px;display:flex;align-items:center;justify-content:space-between;background:white;text-align:left;padding:0 13px;font-size:12px}.node[aria-checked=true]{border-color:#0067c0;background:#edf5fd}.node small{color:#616161;font-size:11px}.empty{margin:auto;text-align:center;font-size:12px;color:#616161}.feedback{height:44px;flex-shrink:0;padding:3px 20px}.feedback>div{height:38px;padding:7px 10px;border-radius:4px;font-size:11px;line-height:1.8;display:flex;gap:8px;align-items:center}.feedback>div.pending{color:#0067c0;background:#edf5fd}.feedback>div.error{color:#b22b1c;background:#fdf0ee}.spinner{width:12px;height:12px;flex-shrink:0;border:2px solid #0067c033;border-top-color:#0067c0;border-radius:50%;animation:spin .8s linear infinite}.picker-footer{height:54px;flex-shrink:0;padding:11px 20px;border-top:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;gap:8px}.picker-footer small{font-size:11px;color:#616161}.btn{height:30px;padding:0 18px;border:1px solid #d1d1d1;border-radius:4px;background:white;font-size:12px}.btn.primary{background:#0067c0;border-color:#0067c0;color:white;min-width:108px}#menu{position:absolute;z-index:4;width:160px;padding:5px;background:white;border:1px solid #d0d4da;border-radius:6px;box-shadow:0 5px 24px #1d304422}#menu button{display:block;border:0;background:white;text-align:left;width:100%;padding:9px 12px;border-radius:4px;font-size:12px}#menu button:hover{background:#edf5fd}#menu hr{border:0;border-top:1px solid #e5e5e5;margin:4px}#menu button.danger{color:#c42b1c}#menu button.danger:hover{background:#fdf0ee}#menu[hidden],#toast[hidden]{display:none}#toast{position:absolute;z-index:5;right:24px;bottom:50px;max-width:85%;padding:12px 18px;border:1px solid #cbdccf;border-radius:5px;background:#edf7ed;color:#0f7b0f;font-size:12px;box-shadow:0 4px 16px #0001;animation:fade .16s ease-out}#contextDialog{width:480px;height:246px;max-width:calc(100vw - 40px);max-height:calc(100dvh - 40px)}#contextDialog::backdrop{background:#0003}#contextDialog[open]{display:flex;flex-direction:column}#contextDialog h2{font-size:20px;font-weight:600;margin:0;padding:22px 24px 14px}#contextDialog>p{padding:0 24px 12px}.context{flex:1;margin:0 24px 16px;padding:14px;border-radius:4px;background:#f3f6f9;font-size:13px;line-height:1.8}#contextDialog footer{flex-shrink:0;border-top:1px solid #e5e5e5;padding:13px 24px;text-align:right}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:760px){main{padding:20px 14px}.foot{display:block}}
</style></head><body><main><h1>代理列表 · 操作归属对应行</h1><p>可体验每行切换节点、启停、编辑及更多菜单。演示数据和反馈仅保存在内存中；搜索等其他控件为视觉占位。</p><div class="tools"><label for="outcome">节点切换结果</label><select id="outcome"><option value="success">成功</option><option value="failure">请求失败</option><option value="unapplied">已保存未生效</option></select></div><div id="stage"><!-- SCREEN --><div id="menu" role="menu" hidden><button id="testRow" role="menuitem">测速</button><button id="copyRow" role="menuitem">复制地址</button><hr><button id="deleteRow" role="menuitem" class="danger">删除代理</button></div><div id="toast" role="status" hidden></div></div><div class="foot"><span>切换靠近节点，启停靠近状态，编辑直接对应行。每行“⋯”提供测速、复制与删除。</span><span><a href="01-row-actions.png" target="_blank">完整预览 ↗</a>　<a href="02-node-picker.png" target="_blank">节点面板预览 ↗</a></span></div></main>
<dialog id="picker" aria-labelledby="pickerTitle"><div class="picker-head"><h2 id="pickerTitle">切换节点</h2><p id="currentNode"></p><button class="close-icon" id="closePicker" aria-label="关闭节点面板">×</button></div><div class="picker-tools"><input id="searchNode" aria-label="搜索节点" placeholder="搜索节点"></div><div class="nodes" id="nodes" role="radiogroup" aria-label="选择节点"></div><div class="feedback" aria-live="polite"><div id="feedback"></div></div><footer class="picker-footer"><small id="nodeCount"></small><button class="btn primary" id="confirmNode">确认切换</button></footer></dialog>
<dialog id="contextDialog" aria-labelledby="contextTitle"><h2 id="contextTitle"></h2><p id="contextHint">操作入口归属演示</p><div class="context" id="contextContent"></div><footer><button class="btn primary" id="closeContext">关闭</button></footer></dialog>
<script>
/* ROW_DATA */
rows.forEach(r=>{r.sourceKind=r.kind;r.baseDelay=r.delay});
const $=s=>document.querySelector(s),stage=$('#stage'),picker=$('#picker');
let target=-1,menuTarget=-1,chosen='',busy=false,returnFocus=null,toastTimer=null,anchor=null;
const rowEl=i=>stage.querySelector('[data-row="'+i+'"]');
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2000)}
function update(i,pending=false){const r=rows[i],el=rowEl(i),failed=r.sourceKind==='red'&&r.on,off=!r.on;const state=pending?'应用中':failed?'启动失败':off?'已关闭':'运行中',color=pending?'#0067c0':failed?'#c42b1c':off?'#616161':'#0f7b0f',bg=pending?'#edf5fd':failed?'#fdf0ee':off?'#f0f0f0':'#edf7ed';const pill=el.querySelector('[data-state-bg]');pill.setAttribute('fill',bg);pill.nextElementSibling.setAttribute('fill',color);el.querySelector('[data-state]').textContent=state;el.querySelector('[data-state]').setAttribute('fill',color);el.querySelector('[data-node]').textContent=failed?'未生效':r.node;el.querySelector('[data-node]').setAttribute('fill',failed||off?'#858585':'#1b1b1b');el.querySelector('[data-meta]').textContent=failed?'端口被占用 · 配置：'+r.node:r.mode+' · '+r.nic;el.querySelector('[data-meta]').setAttribute('fill',failed?'#c42b1c':'#616161');el.querySelector('[data-delay]').textContent=failed||off?'—':r.delay;el.querySelector('[data-rates]').textContent=failed||off?'↑ —  ↓ —':'↑ '+r.up+'  ↓ '+r.down;const toggle=el.querySelector('[data-toggle]'),track=toggle.querySelector('[data-toggle-track]'),thumb=toggle.querySelector('circle');toggle.setAttribute('aria-checked',String(r.on));toggle.setAttribute('aria-disabled',String(pending));track.setAttribute('fill',r.on?'#0067c0':'white');track.setAttribute('stroke',r.on?'none':'#8a8a8a');thumb.setAttribute('cx',r.on?'1081':'1065');thumb.setAttribute('fill',r.on?'white':'#8a8a8a');const running=rows.filter(x=>x.on&&x.sourceKind!=='red').length,closed=rows.filter(x=>!x.on).length,failedCount=rows.filter(x=>x.on&&x.sourceKind==='red').length;stage.querySelector('[data-count]').textContent=rows.length+' 个代理 · '+running+' 个运行中 · '+closed+' 个关闭 · '+failedCount+' 个异常';}
function feedback(type,message){const box=$('#feedback');box.className=type;box.replaceChildren();if(type==='pending'){const s=document.createElement('span');s.className='spinner';box.append(s)}if(message){const t=document.createElement('span');t.textContent=message;box.append(t)}}
function candidates(){return [...new Set([rows[target].node,'东京02','香港03'])]}
function drawNodes(){const list=$('#nodes'),q=$('#searchNode').value.trim().toLowerCase(),names=candidates().filter(n=>n.toLowerCase().includes(q));list.replaceChildren();for(const name of names){const b=document.createElement('button');b.className='node';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(name===chosen));b.disabled=busy;const text=document.createElement('span'),delay=document.createElement('small');text.textContent=name;delay.textContent=name==='东京02'?'58 ms':name==='香港03'?'76 ms':rows[target].baseDelay;b.append(text,delay);b.onclick=()=>{chosen=name;feedback('','');$('#confirmNode').textContent='确认切换';drawNodes()};list.append(b)}if(!names.length){const e=document.createElement('p');e.className='empty';e.textContent='未找到匹配节点';list.append(e)}$('#nodeCount').textContent=names.length+' / '+candidates().length+' 个节点';$('#confirmNode').disabled=busy||(chosen===rows[target].node&&rows[target].sourceKind!=='red');$('#searchNode').disabled=busy;$('#closePicker').disabled=busy;}
function place(){if(!anchor)return;const r=anchor.getBoundingClientRect(),w=Math.min(366,innerWidth-40),h=Math.min(364,innerHeight-40);picker.style.left=Math.max(20,Math.min(innerWidth-w-20,r.right-w+16))+'px';picker.style.top=Math.max(20,Math.min(innerHeight-h-20,r.bottom+h+8>innerHeight-20?r.top-h-8:r.bottom+8))+'px'}
function openPicker(i,element){target=i;anchor=element;returnFocus=element;busy=false;chosen=rows[i].node;$('#pickerTitle').textContent='切换节点 · '+rows[i].name;$('#currentNode').textContent=rows[i].sourceKind==='red'?'当前未生效 · 配置：'+rows[i].node:!rows[i].on?'代理已关闭 · 配置：'+rows[i].node:'当前生效：'+rows[i].node;$('#searchNode').value='';$('#confirmNode').textContent='确认切换';feedback('','');drawNodes();place();picker.showModal()}
function closePicker(){if(busy)return;picker.close();returnFocus?.focus()}
function submit(){if(busy||$('#confirmNode').disabled)return;busy=true;const i=target,outcome=$('#outcome').value,node=chosen;$('#confirmNode').textContent='切换中…';feedback('pending','正在切换到'+node+'…');drawNodes();setTimeout(()=>{busy=false;const r=rows[i];if(outcome==='success'&&r.on&&r.sourceKind!=='red'){r.node=node;r.delay=node==='东京02'?'58 ms':node==='香港03'?'76 ms':r.baseDelay;update(i);picker.close();returnFocus?.focus();notify(r.name+' 已切换到'+node)}else{feedback('error',r.sourceKind==='red'?'选择尚未生效，端口仍被占用。':!r.on?'选择尚未生效，代理当前已关闭。':outcome==='unapplied'?'选择已保存，尚未生效。请重试。':'未能保存节点选择，请重试。');$('#confirmNode').textContent='重试';drawNodes()}},1100)}
function context(i,label){returnFocus=document.activeElement;$('#contextTitle').textContent=label+' · '+rows[i].name;$('#contextContent').textContent=rows[i].name+' · '+rows[i].proto+' :'+rows[i].port+' → '+rows[i].node;$('#contextDialog').showModal()}
function test(i){const r=rows[i],el=rowEl(i).querySelector('[data-delay]');el.textContent=r.on&&r.sourceKind!=='red'?'测速中…':'—';setTimeout(()=>{update(i);notify('测速演示完成 · '+r.name)},800)}
stage.addEventListener('click',event=>{const sw=event.target.closest('[data-switch]');if(sw){openPicker(Number(sw.dataset.switch),sw);return}const edit=event.target.closest('[data-edit]');if(edit){context(Number(edit.dataset.edit),'编辑配置');return}const toggle=event.target.closest('[data-toggle]');if(toggle){if(toggle.getAttribute('aria-disabled')==='true')return;const i=Number(toggle.dataset.toggle);rows[i].on=!rows[i].on;update(i,true);setTimeout(()=>update(i),600);return}const more=event.target.closest('[data-more-row]');if(more){menuTarget=Number(more.dataset.moreRow);const box=$('#menu'),r=more.getBoundingClientRect(),s=stage.getBoundingClientRect();box.hidden=!box.hidden;box.style.left=Math.max(8,Math.min(s.width-168,r.right-s.left-160))+'px';box.style.top=Math.max(8,Math.min(s.height-136,r.bottom-s.top+4))+'px';$('#testRow').focus();return}if(event.target.closest('[data-action="test-all"]'))rows.forEach((r,i)=>test(i))});
stage.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-switch],[data-edit],[data-toggle],[data-more-row],[data-action="test-all"]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(event.key==='Escape')$('#menu').hidden=true});
$('#searchNode').oninput=drawNodes;$('#confirmNode').onclick=submit;$('#closePicker').onclick=closePicker;picker.addEventListener('cancel',event=>{if(busy)event.preventDefault()});picker.addEventListener('click',event=>{if(event.target===picker){const r=picker.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closePicker()}});window.addEventListener('resize',()=>{if(picker.open)place()});
$('#testRow').onclick=()=>{$('#menu').hidden=true;test(menuTarget)};$('#copyRow').onclick=()=>{$('#menu').hidden=true;notify('复制地址演示 · 127.0.0.1:'+rows[menuTarget].port)};$('#deleteRow').onclick=()=>{$('#menu').hidden=true;context(menuTarget,'删除代理入口')};$('#closeContext').onclick=()=>{$('#contextDialog').close();returnFocus?.focus()};document.addEventListener('pointerdown',event=>{if(!event.target.closest('#menu,[data-more-row]'))$('#menu').hidden=true});
</script></body></html>
