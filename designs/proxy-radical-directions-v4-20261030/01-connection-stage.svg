<circle cx="1352" cy="157" r="12" fill="#0067c0"/>
<text x="1352" y="161" font-size="11" fill="white" font-weight="600" text-anchor="middle" >1</text>
<text x="1376" y="162" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >页面中心：流量关系</text>
<text x="1340" y="203" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >单代理用大字号入口与当前节点。</text>
<text x="1340" y="228" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >多代理以连线呈现共享去向，</text>
<text x="1340" y="253" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >能看出哪些端口实际共用出口。</text>
<circle cx="1352" cy="387" r="12" fill="#0067c0"/>
<text x="1352" y="391" font-size="11" fill="white" font-weight="600" text-anchor="middle" >2</text>
<text x="1376" y="392" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >核心交互：目的地操作</text>
<text x="1340" y="433" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >切换按钮直接放在目的地旁。</text>
<text x="1340" y="458" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >共用去向明确标记影响范围，</text>
<text x="1340" y="483" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >提交时就近提醒受影响代理。</text>
<circle cx="1352" cy="617" r="12" fill="#0067c0"/>
<text x="1352" y="621" font-size="11" fill="white" font-weight="600" text-anchor="middle" >3</text>
<text x="1376" y="622" font-size="16" fill="#1b1b1b" font-weight="600" text-anchor="start" >动效：沿路线确认结果</text>
<text x="1340" y="663" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >只在切换期间出现移动光点。</text>
<text x="1340" y="688" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >当前去向保持可见，</text>
<text x="1340" y="713" font-size="13" fill="#616161" font-weight="400" text-anchor="start" >生效后才替换目的地名称。</text>
<rect x="32" y="912" width="524" height="162" rx="8" fill="white" stroke="#e1e4e8" />
<text x="52" y="948" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" >更像连接控制界面</text>
<text x="52" y="985" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >适合少量代理、重视去向关系。</text>
<rect x="578" y="912" width="524" height="162" rx="8" fill="white" stroke="#e1e4e8" />
<text x="598" y="948" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" >跨度在于图形组织</text>
<text x="598" y="985" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >多代理可合并共享出口，减少重复信息。</text>
<rect x="1124" y="912" width="524" height="162" rx="8" fill="white" stroke="#e1e4e8" />
<text x="1144" y="948" font-size="15" fill="#1b1b1b" font-weight="600" text-anchor="start" >需要控制复杂度</text>
<text x="1144" y="985" font-size="12" fill="#616161" font-weight="400" text-anchor="start" >连接多时收敛为分组，避免交叉线过密。</text>
