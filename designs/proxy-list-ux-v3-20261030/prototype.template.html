function rowHTML(r){const state=status(r),pending=Boolean(r.pending),failed=state==='error',off=state==='off',title=r.pending?(r.pending==='enable'?'启用中':'停用中'):failed?'启动失败':off?'已关闭':'运行中',node=r.activeNode|| (failed?'未生效':'—'),disabled=pending?' disabled':'';let action='';if(failed)action='<button class="linkbtn" data-act="repair"'+disabled+' aria-label="修改 '+esc(r.name)+' 的端口">修改端口</button>';else if(r.mode==='手动选择')action='<button class="switch-node" data-act="switch"'+disabled+' aria-label="'+(off?'选择':'切换')+esc(r.name)+'的节点">'+(off?'选择节点':'切换节点')+'</button>';const delay=r.testing?'测速中…':state==='running'?r.delay:'—';return '<tr data-id="'+r.id+'"><td class="identity"><div class="name" title="'+esc(r.name)+'">'+esc(r.name)+'</div><div class="entry"><span>'+esc(r.proto)+' :'+esc(r.port)+'</span><button class="iconbtn" data-act="copy" title="复制地址 127.0.0.1:'+esc(r.port)+'" aria-label="复制 '+esc(r.name)+' 的地址">'+icon('ContentCopyOutlined')+'</button></div></td><td><div class="desttop"><span class="node-name'+(!r.activeNode?' muted':'')+'" title="'+esc(node)+'">'+esc(node)+'</span>'+action+'</div><div class="meta'+(failed?' error':r.unapplied?' warning':'')+'" title="'+esc(hint(r))+'">'+esc(hint(r))+'</div></td><td><div class="delay'+(parseInt(delay)>300?' warning':'')+'">'+esc(delay)+'</div><div class="rates">'+(state==='running'?'↑ '+esc(r.up)+'　↓ '+esc(r.down):'↑ —　↓ —')+'</div></td><td class="statuscell"><span class="state'+(pending?' pending':failed?' error':off?' off':'')+'"><i class="dot"></i>'+title+'</span></td><td class="togglecell"><button class="toggle" role="switch" aria-checked="'+r.enabled+'" aria-label="启用 '+esc(r.name)+'" data-act="toggle"'+disabled+'><span></span></button></td><td class="editcell"><div class="editgroup"><button class="linkbtn" data-act="edit"'+disabled+' aria-label="编辑 '+esc(r.name)+' 的配置">编辑配置</button><button class="iconbtn" data-act="more" aria-haspopup="menu" aria-expanded="false"'+disabled+' aria-label="'+esc(r.name)+' 的更多操作">' function counts(){for(const b of document.querySelectorAll('[data-filter]')){const k=b.dataset.filter;b.querySelector('span').textContent=k==='all'?data.length:data.filter(r=>status(r)===k).length;b.setAttribute('aria-pressed',String(filter===k))}const shown=data.filter(matches).length;$('#count').textContent='显示 '+shown+' / '+data.length+' 个代理';$('#clearQuery').hidden=!query;$('#testAll').disabled=!data.some(r=>status(r)==='running')||data.some(r=>r.testing)}

function updateRow(id){const r=get(id),old=$('#rows').querySelector('[data-id="'+id+'"]');if(!r||!matches(r)||!old){render();return}const focus=document.activeElement,act=old.contains(focus)?focus.dataset.act:null;const holder=document.createElement('tbody');holder.innerHTML=rowHTML(r);old.replaceWith(holder.firstElementChild);counts();if(act)$('#rows').querySelector('[data-id="'+id+'"] [data-act="'+act+'"]')?.focus()}
function showToast(text,error=false,action=null){clearTimeout(toastTimer);const box=$('#toast');box.hidden=false;box.classList.toggle('error',error);box.querySelector('span').textContent=text;const button=box.querySelector('button');button.hidden=!action;button.textContent=action?'查看全部':'';button.onclick=action;toastTimer=setTimeout(()=>box.hidden=true,error?5000:3000)}
function reveal(id,act='edit'){const el=$('#rows').querySelector('[data-id="'+id+'"] [data-act="'+act+'"]');if(el)el.focus();else $('#searchProxy').focus()}
function afterUpdate(id,message,act){updateRow(id);const hidden=!get(id)||!matches(get(id));showToast(message+(hidden&&get(id)?'，已移出当前筛选':''),false,hidden&&get(id)?()=>{filter='all';query='';$('#searchProxy').value='';render();reveal(id,act)}:null);reveal(id,act)}
function reset(){query='';filter='all';$('#searchProxy').value='';render();$('#searchProxy').focus()}
$('#searchProxy').addEventListener('input',e=>{query=e.target.value;closeMenu(false);render()});$('#clearQuery').onclick=()=>{query='';$('#searchProxy').value='';render();$('#searchProxy').focus()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;closeMenu(false);render()});$('#resetFilters').onclick=()=>data.length?reset():openEditor(null,$('#resetFilters'));
function closeMenu(restore=true){$('#menu').hidden=true;menuAnchor?.setAttribute('aria-expanded','false');if(restore)menuAnchor?.focus()}
function openMenu(id,anchor){const same=!$('#menu').hidden&&menuId===id;closeMenu(false);if(same)return;menuId=id;menuAnchor=anchor;anchor.setAttribute('aria-expanded','true');const r=anchor.getBoundingClientRect(),box=$('#menu');box.hidden=false;box.style.left=Math.max(12,Math.min(innerWidth-186,r.right-174))+'px';box.style.top=Math.max(12,Math.min(innerHeight-150,r.bottom+5))+'px';box.querySelector('[data-menu="test"]').disabled=status(get(id))!=='running'||get(id).testing;[...box.querySelectorAll('button')].find(b=>!b.disabled)?.focus()}
async function copyAddress(r){const value='127.0.0.1:'+r.port;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(value);else{const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();const copied=document.execCommand?.('copy');input.remove();if(!copied)throw Error('copy')}showToast(r.name+'：已复制 '+value)}catch{showToast('复制失败，请手动复制：'+value,true)}}
function testRow(id,silent=false){const r=get(id);if(!r||status(r)!=='running'||r.testing)return;r.testing=true;updateRow(id);setTimeout(()=>{const row=get(id);if(!row)return;row.testing=false;updateRow(id);if(!silent)showToast(row.name+'：测速完成')},800)}
$('#testAll').onclick=()=>{const ids=data.filter(r=>status(r)==='running').map(r=>r.id);ids.forEach(id=>testRow(id,true));$('#testAll').disabled=true;setTimeout(()=>{counts();showToast('已完成 '+ids.length+' 个运行中代理的测速')},850)};
function toggleRow(id){const r=get(id);if(!r||r.pending)return;r.stableStatus=status(r);r.enabled=!r.enabled;r.pending=r.enabled?'enable':'disable';updateRow(id);setTimeout(()=>{const row=get(id);if(!row)return;row.pending='';row.activeNode=row.enabled&&!row.failure?row.configNode:null;row.unapplied=false;afterUpdate(id,row.name+(row.enabled?(row.failure?'：启用失败，端口被占用':'已启用'):'已停用'),'toggle')},700)}
function candidates(){const r=get(pickerId);return [...new Set([r.originalNode,r.activeNode,r.configNode,'东京02','香港03'].filter(Boolean))]}
function setFeedback(type,message){pickerMessage=message?{type,message}:null;const box=$('#feedback');box.className='feedback '+type;box.replaceChildren();if(type==='pending'){const span=document.createElement('span');span.className='spinner';box.append(span)}if(message){const p=document.createElement('span');p.textContent=message;box.append(p)}}
function drawCandidates(focusName=null){const r=get(pickerId),q=$('#nodeSearch').value.trim().toLowerCase(),names=candidates().filter(n=>n.toLowerCase().includes(q));$('#nodes').innerHTML=names.map(n=>'<button type="button" class="candidate" role="radio" data-candidate="'+esc(n)+'" aria-checked="'+(n===chosen)+'" tabindex="'+(n===chosen?'0':'-1')+'"'+(pickerBusy?' disabled':'')+'><span>'+esc(n)+(n===r.activeNode?'<small class="current">当前生效</small>':'')+'</span><small>'+(n==='东京02'?'58 ms':n==='香港03'?'76 ms':esc(r.delay))+'</small></button>').join('');if(!names.length){$('#nodes').innerHTML='<div class="nodeempty">未找到匹配节点<button class="linkbtn" id="resetNodeSearch">清空搜索</button></div>';$('#resetNodeSearch').onclick=()=>{$('#nodeSearch').value='';drawCandidates();$('#nodeSearch').focus()}}else if(!names.includes(chosen))$('#nodes').querySelector('.candidate').tabIndex=0;$('#chosenLabel').textContent='已选：'+chosen;$('#chosenLabel').title=chosen;$('#nodeCount').textContent=names.length+' / '+candidates().length+' 个节点';const noop=r.enabled?chosen===r.activeNode&&chosen===r.configNode:chosen===r.configNode;$('#applyNode').disabled=pickerBusy||noop;$('#nodeSearch').disabled=pickerBusy;$('#cancelPicker').disabled=pickerBusy;$('#closePicker').disabled=pickerBusy;if(focusName)[...$('#nodes').querySelectorAll('[data-candidate]')].find(b=>b.dataset.candidate===focusName)?.focus()}
function positionPicker(){if(!pickerAnchor)return;const r=pickerAnchor.getBoundingClientRect(),w=Math.min(412,innerWidth-40),h=Math.min(400,innerHeight-40);$('#picker').style.left=Math.max(20,Math.min(innerWidth-w-20,r.right-w+12))+'px';$('#picker').style.top=Math.max(20,Math.min(innerHeight-h-20,r.bottom+h+8>innerHeight-20?r.top-h-8:r.bottom+8))+'px'}
function openPicker(id,anchor){pickerId=id;pickerAnchor=anchor;pickerBusy=false;const r=get(id);chosen=r.configNode;$('#pickerTitle').textContent=(r.enabled?'切换节点':'选择节点')+' · '+r.name;$('#pickerTitle').title=$('#pickerTitle').textContent;$('#currentNode').textContent=r.enabled?'当前生效：'+(r.activeNode||'—'):'代理已关闭，保存后下次启用生效';$('#nodeSearch').value='';$('#applyNode').textContent=r.enabled?'确认切换':'保存选择';setFeedback(r.unapplied?'warning':'',r.unapplied?'已选 '+r.configNode+'，尚未生效；当前仍使用 '+r.activeNode:'');drawCandidates();positionPicker();$('#picker').showModal();$('#nodeSearch').focus()}

$('#nodes').addEventListener('click',e=>{const b=e.target.closest('[data-candidate]');if(!b||pickerBusy)return;chosen=b.dataset.candidate;setFeedback('','');$('#applyNode').textContent=get(pickerId).enabled?'确认切换':'保存选择';drawCandidates(chosen)});$('#nodes').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key)||pickerBusy)return;const options=[...$('#nodes').querySelectorAll('[data-candidate]')];if(!options.length)return;e.preventDefault();let i=options.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?options.length-1:(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;chosen=options[i].dataset.candidate;setFeedback('','');drawCandidates(chosen)});$('#nodeSearch').oninput=()=>drawCandidates();$('#cancelPicker').onclick=closePicker;$('#closePicker').onclick=closePicker;$('#picker').addEventListener('cancel',e=>{e.preventDefault();closePicker()});
$('#applyNode').onclick=()=>{if(pickerBusy||$('#applyNode').disabled)return;pickerBusy=true;const id=pickerId,node=chosen,outcome=$('#outcome').value,r=get(id);$('#applyNode').textContent=r.enabled?'切换中…':'保存中…';setFeedback('pending',(r.enabled?'正在切换到 ':'正在保存 ')+node+'…');drawCandidates();setTimeout(()=>{pickerBusy=false;const row=get(id);if(outcome==='failure'){setFeedback('error','未能保存节点选择。'+(row.activeNode?'当前仍使用 '+row.activeNode+'。':''));$('#applyNode').textContent='重试';drawCandidates();return}row.configNode=node;if(row.enabled&&outcome==='unapplied'){row.unapplied=true;updateRow(id);setFeedback('warning','选择已保存，尚未生效。当前仍使用 '+row.activeNode+'，可重试生效。');$('#applyNode').textContent='重试生效';drawCandidates();return}row.unapplied=false;row.activeNode=row.enabled?node:null;row.delay=node==='东京02'?'58 ms':node==='香港03'?'76 ms':row.delay;$('#picker').close();afterUpdate(id,row.name+(row.enabled?'已切换到 '+node:'已保存节点，下次启用时生效'),'switch')},1100)};
function clearErrors(){for(const id of ['name','port','node']){$('#'+id+'Error').textContent='';$('#edit'+id[0].toUpperCase()+id.slice(1)).setAttribute('aria-invalid','false')}$('#editFeedback').textContent=''}
function openEditor(id,anchor,repair=false){editorId=id;editAnchor=anchor;editorBusy=false;const r=id?get(id):{name:'',port:String(Math.max(7898,...data.map(x=>Number(x.port)))+1),proto:'SOCKS5',mode:'手动选择',nic:'系统默认网卡',configNode:'新加坡01'};$('#editTitle').textContent=(repair?'修改端口':id?'编辑配置':'新增代理')+(id?' · '+r.name:'');$('#editSubtitle').textContent=repair?'端口 :'+r.port+' 已被占用，请使用其他端口。':'';for(const field of $('#editForm').elements)field.disabled=false;$('#editName').value=r.name;$('#editPort').value=r.port;$('#editProto').value=r.proto;$('#editMode').value=r.mode;$('#editNic').value=r.nic;populateEditorNodes(r.configNode);$('#editNode').disabled=r.mode==='直连';clearErrors();$('#saveEditor').textContent='保存配置';$('#saveEditor').disabled=false;$('#cancelEditor').disabled=false;$('#closeEditor').disabled=false;$('#editor').showModal();(repair?$('#editPort'):$('#editName')).focus();if(repair)$('#editPort').select()}

function populateEditorNodes(value){const direct=$('#editMode').value==='直连',names=direct?['直连']:[...new Set(['新加坡01','东京01','东京02','香港02','香港03','美国西部02',...data.map(r=>r.configNode)])].filter(n=>n!=='直连');$('#editNode').innerHTML=names.map(n=>'<option>'+esc(n)+'</option>').join('');$('#editNode').value=names.includes(value)?value:names[0]}$('#editMode').onchange=()=>{populateEditorNodes($('#editNode').value);$('#editNode').disabled=$('#editMode').value==='直连'};
$('#editForm').onsubmit=e=>{e.preventDefault();if(editorBusy)return;clearErrors();const name=$('#editName').value.trim(),rawPort=$('#editPort').value.trim(),port=Number(rawPort),mode=$('#editMode').value,node=mode==='直连'?'直连':$('#editNode').value.trim();let invalid=null;function bad(field,message){$('#'+field+'Error').textContent=message;const input=$('#edit'+field[0].toUpperCase()+field.slice(1));input.setAttribute('aria-invalid','true');invalid??=input}if(!name)bad('name','请输入代理名称');if(!/^\d+$/.test(rawPort)||port<1||port>65535)bad('port','请输入 1–65535 之间的端口');else if(occupiedPorts.has(String(port))||data.some(r=>r.id!==editorId&&String(r.port)===String(port)))bad('port','该端口已被占用，请更换');if(!node)bad('node','请选择节点');if(invalid){invalid.focus();return}editorBusy=true;$('#saveEditor').disabled=true;$('#cancelEditor').disabled=true;$('#closeEditor').disabled=true;$('#saveEditor').textContent='保存中…';const values={name,port:String(port),proto:$('#editProto').value,mode,nic:$('#editNic').value,configNode:node};for(const field of $('#editForm').elements)field.disabled=true;$('#editFeedback').textContent='正在保存并应用配置…';setTimeout(()=>{editorBusy=false;let r=editorId?get(editorId):null;if(r){const invalidateDelay=r.failure||r.configNode!==values.configNode||r.delay==='—';Object.assign(r,values);if(invalidateDelay)r.delay='未测速';r.failure=false;r.unapplied=false;r.activeNode=r.enabled?node:null;r.delay=r.delay==='—'?'未测速':r.delay}else{r={...values,id:'n'+Date.now(),originalNode:node,enabled:true,activeNode:node,failure:false,pending:'',unapplied:false,delay:'未测速',up:'0 B/s',down:'0 B/s'};data.push(r)}$('#editor').close();afterUpdate(r.id,r.name+'：配置已保存'+(r.enabled?'并生效':''),'edit')},800)};
function openDelete(id,anchor){deleteId=id;deleteAnchor=anchor;const r=get(id);$('#deleteTitle').textContent='删除代理「'+r.name+'」？';$('#deleteBody').textContent='将移除代理「'+r.name+'」及入口 :'+r.port+' 的配置。';$('#deleteDialog').showModal();$('#cancelDelete').focus()}
$('#cancelDelete').onclick=()=>{$('#deleteDialog').close();if(deleteId)reveal(deleteId,'more')};$('#deleteDialog').addEventListener('cancel',e=>{e.preventDefault();$('#cancelDelete').click()});$('#confirmDelete').onclick=()=>{const r=get(deleteId);data=data.filter(x=>x.id!==deleteId);$('#deleteDialog').close();render();showToast(r.name+' 已删除');$('#searchProxy').focus()};
$('#rows').addEventListener('click',e=>{const button=e.target.closest('[data-act]'),row=e.target.closest('[data-id]');if(!button||!row||button.disabled)return;const id=row.dataset.id,r=get(id);switch(button.dataset.act){case 'switch':openPicker(id,button);break;case 'repair':openEditor(id,button,true);break;case 'edit':openEditor(id,button);break;case 'copy':copyAddress(r);break;case 'toggle':toggleRow(id);break;case 'more':openMenu(id,button);break}});
