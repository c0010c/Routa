function renderCard(p){const c=cfg(p),n=node(c.node),st=status(p),ruleCount=state.rules.filter(r=>r.proxy===p.id).length;return `<article class="rp-card" aria-label="${esc(p.name)}"><div class="rp-cardhead"><span class="rp-cardname">${esc(p.name)}</span><span class="rp-tag">${p.type==='Mixed'?'混合':TYPE[p.type]}</span>${statusMarkup(p)}<span class="rp-spacer"></span><label class="rp-switch"><span>${p.enabled?'已启用':'已停用'}</span><input type="checkbox" data-change="enable" data-id="${p.id}" aria-label="启用 ${esc(p.name)}" ${p.enabled?'checked':''}></label>${button('•••','proxy-menu',p.id,'rp-iconbtn',`aria-label="${esc(p.name)} 更多操作"`)}</div>${st[1]==='error'?`<div class="rp-alert error"><span>!</span><span>${p.error?'配置已保存，但未成功应用；代理端口已关闭。':badNic(c)?`${esc(NIC[effectiveNic(c)])}不可用；已停止转发。`:'当前节点不可用；已停止转发。'} ${button(p.error?'重试应用':'修改连接',p.error?'retry':'edit-connection',p.id,'rp-text')}</span></div>`:''}<div class="rp-cardbody"><div><span class="rp-label">本地地址</span><div class="rp-address rp-mono">${esc(p.address)}:${p.port}</div><div class="rp-small rp-dim">${TYPE[p.type]}${p.auth?' · 已启用认证':''}</div><div style="margin-top:10px" class="rp-row">${button('复制地址','copy',p.id,'rp-text')}${button('端口与认证','edit-proxy',p.id,'rp-text')}</div></div><div><div class="rp-between"><span class="rp-label">${c.mode==='group'?`策略组 · ${STRATEGY[c.strategy]}`:'连接方式'}</span>${p.share?button('↗ '+esc(share(p.share)?.name),'share-detail',p.share,'rp-text'):''}</div><button class="rp-nodebutton" data-action="quick-node" data-id="${p.id}" aria-label="${esc(p.name)} 选择节点"><span aria-hidden="true">${c.mode==='direct'?'↗':'◇'}</span><strong>${c.mode==='direct'?'直连':esc(targetLabel(c))}</strong>${c.mode!=='direct'&&(c.mode!=='group'||c.strategy!=='LoadBalance')&&n?.delay!=null?`<span class="rp-good rp-small">${n.delay} ms</span>`:''}<span class="rp-arrow" aria-hidden="true">⌄</span></button><div class="rp-node-meta"><span class="rp-dim">出站网卡 · <button class="rp-text" data-action="quick-nic" data- function renderResources(){return head('订阅与节点','管理节点来源，代理配置直接引用这些节点。',button('＋ 添加节点','create-node','','rp-btn')+button('＋ 添加订阅','create-sub','','rp-btn primary'))+`<h2 style="margin-bottom:12px">订阅</h2><div class="rp-cards">${state.subscriptions.map(s=>`<div class="rp-card"><div class="rp-cardhead"><span class="rp-cardname">${esc(s.name)}</span><span class="rp-tag">${state.nodes.filter(n=>n.source===s.name).length} 个节点</span><span class="rp-spacer"></span>${button('更新','update-sub',s.id,'rp-text')}${button('设置','edit-sub',s.id,'rp-btn')}</div><div style="padding:14px 18px" class="rp-between rp-small rp-dim"><span>更新于 ${esc(s.updated)}</span><span>拉取失败时 · ${s.fallback?esc(share(s.fallback)?.name||'方案已移除'):'不使用备用连接'}</span></div></div>`).join('')}</div><h2 class="rp-section">节点</h2><div class="rp-card rp-tablewrap"><table><thead><tr><th>名称</th><th>来源</th><th>协议</th><th>延迟</th><th></th></tr></thead><tbody>${state.nodes.map(n=>`<tr><td><strong>${esc(n.name)}</strong></td><td>${esc(n.source)}</td><td>${esc(n.protocol)}</td><td class="${n.delay===null?'rp-bad':'rp-good'}">${n.delay===null?'超时':n.delay+' ms'}</td><td>${button('使用此节点','use-node',n.id,'rp-text')}</td></tr>`).join('')}</tbody></table></div>`;}
function renderSettings(){return head('设置','')+`<div class="rp-card"><div class="rp-ruleline"><div><h3>开机启动</h3></div><span class="rp-spacer"></span><label class="rp-switch"><input type="checkbox" aria-label="开机启动" data-change="setting" data-id="start" ${state.settings.start?'checked':''}></label></div><div class="rp-ruleline"><h3>关闭窗口时最小化到托盘</h3><span class="rp-spacer"></span><label class="rp-switch"><input type="checkbox" aria-label="最小化到托盘" data-change="setting" data-id="minimize" ${state.settings.minimize?'checked':''}></label></div><div class="rp-ruleline"><h3>自动测速间隔</h3><span class="rp-spacer"></span><select aria-label="自动测速间隔" class="rp-inline-select" data-change="setting" data-id="interval">${[['0','关闭'],['300','5 分钟'],['600','10 分钟'],['1800','30 分钟']].map(([v,l])=>`<option value="${v}" ${state.settings.interval===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="rp-ruleline"><h3>外观</h3><span class="rp-spacer"></span><span class="rp-dim">深色 · Windows 风格</span></div></div><div class="rp-section rp-dim rp-small">Routa v0.2.0 · 交互设计预览</div>`;}

case'proxy-menu':{const p=proxy(id);openDialog(esc(p.name),'代理操作',`<div class="rp-stack">${button('编辑代理','edit-proxy',id,'rp-option')}${button('配置连接','edit-connection',id,'rp-option')}${button('复制为新代理','duplicate',id,'rp-option')}${!p.share?button('将连接保存为共享方案','promote',id,'rp-option'):button('查看共享方案','share-detail',p.share,'rp-option')}${button('删除代理','delete-proxy',id,'rp-option rp-bad')}</div>`);break;}
case'duplicate':{const p=clone(proxy(id));p.id=uid('p');p.name+=' 副本';p.port=Math.max(7880,...state.proxies.map(x=>x.port))+1;p.enabled=false;makeDraft('proxy',p,true);break;}
case'promote':{const p=proxy(id);pending={type:'promote',id};openDialog('保存为共享方案','此代理将成为方案的第一个使用者。',field('share-name','方案名称',p.name+'线路')+'<div id="rp-promote-error" role="alert" class="rp-bad rp-small"></div>',button('取消','close','','rp-btn')+button('创建并关联','confirm-promote','','rp-btn primary'));break;}
case'confirm-promote':{const name=dialog.querySelector('#share-name').value.trim();if(!name||state.shares.some(s=>s.name===name)){dialog.querySelector('#rp-promote-error').textContent='请输入不重复的方案名称。';return;}const p=proxy(pending.id),s={...clone(cfg(p)),id:uid('s'),name};['port','address','type','enabled','auth','username','password','share','error'].forEach(k=>delete s[k]);state.shares.push(s);p.share=s.id;closeDialog();render();save();toast('共享方案已创建，此代理已关联。');break;}
case'delete-share':deleteShare(id);break;case'confirm-delete-share':{const s=share(pending.id),refs=users(s);const mode=dialog.querySelector('input[name=delete-mode]:checked')?.value||'independent',replacement=dialog.querySelector('#replacement')?.value;if(mode==='replace'&&!replacement){dialog.querySelector('#rp-delete-error').textContent='请选择一个替代方案。';return;}const before=clone(state);state.proxies.filter(p=>p.share===s.id).forEach(p=>{if(mode==='replace')p.share=replacement;else{const id=p.id,name=p.name;Object.assign(p,clone(s),{id,name,share:null});}});state.subscriptions.filter(x=>x.fallback===s.id).forEach(x=>x.fallback=mode==='replace'?replacement:null);state.shares=state.shares.filter(x=>x.id!==s.id);closeDialog();render();save();toast('共享方案已删除，引用已处理。',()=>{state=before;render();save();toast('已恢复共享方案和引用。');});break;}
case'delete-proxy':deleteProxy(id);break;case'confirm-delete-proxy':{const id=pending.id,refs=state.rules.filter(r=>r.proxy===id),replacement=dialog.querySelector('#replacement')?.value;if(refs.length&&!replacement){dialog.querySelector('#rp-delete-error').textContent='请为关联应用选择替代代理。';return;}const before=clone(state);refs.forEach(r=>r.proxy=replacement);state.proxies=state.proxies.filter(p=>p.id!==id);if(state.system===id)state.system=null;closeDialog();render();save();toast('代理已删除。',()=>{state=before;render();save();toast('已恢复代理及关联。');});break;}
case'copy':{const p=proxy(id),address=p.address+':'+p.port;try{await navigator.clipboard.writeText(address);toast('已复制 '+address);}catch{openDialog('复制本地地址','',field('copy-address','地址',address,'text','readonly'),button('关闭','close','','rp-btn'));dialog.querySelector('input').select();}break;}
case'system':{const p=proxy(id);if(state.system===id){state.system=null;render();save();toast('系统接管已关闭。');}else{pending={type:'system',id};openDialog('使用「'+esc(p.name)+'」接管系统流量','',`${select('capture','接管方式',state.capture,[['System','系统代理'],['Tun','TUN']])}<div class="rp-alert info">系统代理影响遵循系统代理设置的应用；TUN 接管系统网络流量。</div>${state.system?`<p class="rp-small rp-dim">将替换当前的「${esc(proxy(state.system)?.name)}」。</p>`:''}`,button('取消','close','','rp-btn')+button('启用接管','confirm-system','','rp-btn primary'));}break;}
case'confirm-system':state.system=pending.id;state.capture=dialog.querySelector('#capture').value;closeDialog();render();save();toast('系统接管已切换。');break;
case'retry':proxy(id).error=false;render();save();toast('已重新应用配置。');break;case'manage-apps':goto('process');break;case'create-rule':if(state.proxies.length)ruleDialog();else toast('请先创建一个代理。');break;
case'save-rule':{const name=dialog.querySelector('#rule-name').value.trim(),path=dialog.querySelector('#rule-path').value.trim(),target=dialog.querySelector('#rule-proxy').value;if(!name||!path.toLowerCase().endsWith('.exe')||!target){dialog.querySelector('#rp-rule-error').textContent='请填写名称、.exe 完整路径，并选择代理。';return;}state.rules.push({id:uid('r'),name,path,proxy:target,enabled:true});closeDialog();render();save();toast('应用已添加。');break;}
case'delete-rule':{const before=clone(state.rules);state.rules=state.rules.filter(r=>r.id!==id);render();save();toast('应用规则已移除。',()=>{state.rules=before;render();save();toast('已恢复规则。');});break;}
case'create-sub':editSub();break;case'edit-sub':editSub(id);break;case'update-sub':state.subscriptions.find(s=>s.id===id).updated='刚刚';render();save();toast('示例订阅已更新。');break;case'sub-shares':closeDialog();goto('shares');break;
case'use-node':makeDraft('proxy',newProxy(id),true);break;case'create-node':pending={type:'node'};openDialog('添加节点','原型中使用示例连接参数。',`${field('node-name','节点名称','') }<div style="margin-top:14px">${select('node-protocol','协议','Shadowsocks',[['Shadowsocks','Shadowsocks'],['Trojan','Trojan'],['VLESS','VLESS']])}</div>${field('node-server','服务器地址','') }<div id="rp-node-error" role="alert" class="rp-bad rp-small"></div>`,button('取消','close','','rp-btn')+button('添加节点','save-node','','rp-btn primary'));break;
case'save-node':{const name=dialog.querySelector('#node-name').value.trim(),server=dialog.querySelector('#node-server').value.trim();if(!name||!server){dialog.querySelector('#rp-node-error').textContent='请填写节点名称和服务器地址。';return;}state.nodes.push({id:uid('n'),name,region:'自建',source:'手动节点',protocol:dialog.querySelector('#node-protocol').value,delay:75});closeDialog();render();save();toast('示例节点已添加。');break;}
case'scenarios':scenarios();break;case'review':review();break;case'review-step':{closeDialog();state=clone(initial);render();if(id==='new')makeDraft('proxy',newProxy(),true);if(id==='node')openPicker('quick','node','p1');if(id==='shared')sharedChoice(proxy('p2'),'edit');if(id==='group'){const p=clone(proxy('p1'));p.mode='group';makeDraft('connection',p);}if(id==='delete'){goto('shares');deleteShare('s1');}save();break;}
case'scenario':closeDialog();state=clone(initial);if(id==='empty'){state.proxies=[];state.rules=[];state.shares=[];state.system=null;state.subscriptions[0].fallback=null;}if(id==='offline')state.offline=true;if(id==='failure')state.failNext=true;render();save();toast(id==='failure'?'下一次保存将演示应用失败；保存后可在卡片中重试。':id==='offline'?'已模拟以太网断开；两个共享代理会受影响。':'已载入示例状态。');break;
case'undo':{const fn=undo;undo=null;toastEl.hidden=true;fn?.();break;}case'hide-toast':toastEl.hidden=true;break;
}});
render();
if(globalThis.Tweak){const design={density:'comfortable'};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.density=design.density;}});tweak.addSelect(design,'density',{label:'卡片密度',options:[{value:'comfortable',label:'舒适'},{value:'compact',label:'紧凑'}]});}
})();
</script>
