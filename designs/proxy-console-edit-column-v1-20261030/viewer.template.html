<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routa · 代理终端 · 独立编辑列</title><style>
:root{font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;background:#e9edf2;color:#1b1b1b;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1360px;margin:auto;padding:24px 32px}h1{margin:0 0 8px;font-size:23px;font-weight:600}p{margin:0 0 18px;font-size:12px;color:#616161;line-height:1.8}#stage>svg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 8px 32px #23364c12}#stage [data-edit]:hover [data-edit-hit]{fill:#e1effd}#stage [data-row]:focus-visible,#stage [data-edit]:focus-visible,button:focus-visible{outline:2px solid #0067c0;outline-offset:3px}#stage [data-row]:hover>[data-selection]{filter:brightness(.98)}button{font:inherit;cursor:pointer}dialog{width:480px;height:246px;max-width:calc(100vw - 40px);max-height:calc(100dvh - 40px);border:1px solid #d0d5dc;border-radius:8px;padding:0;box-shadow:0 12px 50px #0003;background:white;color:#1b1b1b}dialog::backdrop{background:#0003}dialog[open]{display:flex;flex-direction:column}dialog h2{font-size:20px;font-weight:600;padding:22px 24px 16px;margin:0;flex-shrink:0}dialog p{margin:0;padding:0 24px 12px}dialog .context{margin:0 24px;flex:1;padding:12px 14px;border-radius:5px;background:#f3f6f9;font-size:13px;line-height:1.8}dialog footer{padding:14px 24px;border-top:1px solid #e5e5e5;display:flex;justify-content:flex-end;flex-shrink:0}dialog button{background:#0067c0;color:white;border:0;border-radius:4px;padding:7px 22px}.foot{margin-top:16px;color:#616161;font-size:12px}a{color:#0067c0;text-decoration:none}@media(max-width:760px){main{padding:20px 14px}}
</style></head><body><main><h1>代理终端 · 独立编辑列</h1><p>可点击每行“编辑配置”，查看其对应目标；点击行可切换底部当前选中信息。此预览只演示操作归属，其余按钮为视觉占位，未连接实际软件。</p><div id="stage"><!-- SCREEN --></div><p class="foot">编辑列始终可见，不要求先选中行。底部保留当前选中项的切换节点、启停与测速。<a href="01-edit-column.png" target="_blank">查看原图 ↗</a></p></main><dialog id="editPreview" aria-labelledby="editTitle"><h2 id="editTitle">编辑配置</h2><p>编辑入口归属演示</p><div id="editContext" class="context"></div><footer><button id="close">关闭</button></footer></dialog><script>
/* ROW_DATA */
const stage=document.querySelector('#stage'),dialog=document.querySelector('#editPreview');let previousFocus=null;
function selectRow(index){stage.querySelectorAll('[data-row]').forEach(el=>{const active=Number(el.dataset.row)===index;el.querySelector('[data-selection]').setAttribute('fill',active?'#e9f3ff':'transparent');el.querySelector('[data-selection-edge]').setAttribute('fill',active?'#0067c0':'transparent')});const r=rows[index];stage.querySelector('[data-current-title]').textContent='当前选中：'+r.name+'  :'+r.port+' → '+(r.kind==='red'?'未生效':r.node);stage.querySelector('[data-current-meta]').textContent=r.mode+' · '+r.nic}
stage.addEventListener('click',event=>{const edit=event.target.closest('[data-edit]');if(edit){event.stopPropagation();const r=rows[Number(edit.dataset.edit)];previousFocus=edit;document.querySelector('#editTitle').textContent='编辑配置 · '+r.name;document.querySelector('#editContext').textContent=r.name+' · '+r.proto+' :'+r.port+' → '+r.node;dialog.showModal();return}if(event.target.closest('[data-action]'))return;const row=event.target.closest('[data-row]');if(row)selectRow(Number(row.dataset.row))});
stage.addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-edit],[data-row]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.querySelector('#close').onclick=()=>{dialog.close();previousFocus?.focus()};stage.querySelectorAll('[data-action]').forEach(el=>{el.removeAttribute('tabindex');el.style.cursor='default'});
</script></body></html>
