name: Publish updater manifests

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updater-manifest
  cancel-in-progress: false

jobs:
  manifest:
    name: Publish latest.json and latest-proxy.json
    # The fixed "updater" release only stores the manifests.
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'updater'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Generate and upload manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/updater-manifest.mjs
