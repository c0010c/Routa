name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Frontend production build
        run: pnpm build

  windows:
    name: Windows tests and build
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify the pinned mihomo core
        run: pnpm fetch-mihomo
      - name: Fetch WinDivert
        run: pnpm fetch-windivert
      - name: Build ProxyBridgeCore.dll
        run: pnpm build-proxybridge
      - name: Build the process-routing service
        run: pnpm build-procsvc --locked
      - name: Build artifact regression tests
        run: node --test scripts/build-artifacts.test.mjs scripts/updater-manifest.test.mjs
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace
      - name: Real mihomo integration test
        timeout-minutes: 10
        env:
          MIHOMO_BIN: ${{ github.workspace }}\src-tauri\binaries\mihomo-x86_64-pc-windows-msvc.exe
          # Ensure curl sends loopback requests through the test's proxy.
          NO_PROXY: ''
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test e2e_real_core -- --ignored --nocapture
      - name: Build Windows application
        run: pnpm tauri build --no-bundle -- --locked
      - name: Verify Windows application
        run: |
          $exe = "src-tauri/target/release/routa.exe"
          if (!(Test-Path $exe)) { throw "Missing application: $exe" }
          & $exe --build-info | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "routa.exe --build-info failed with exit code $LASTEXITCODE" }
